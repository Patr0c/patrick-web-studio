<!doctype html><html lang="de"><meta charset="utf-8"><title>Solar decoder baseline</title><style>body{background:#030508;color:white;font:13px monospace}video{width:240px;height:240px;display:block}pre{white-space:pre-wrap}</style><pre id="result">Messe reine Videowiedergabe ohne Websiteeffekte…</pre><video muted autoplay playsinline loop src="../assets/video/sun-smooth-desktop.mp4"></video><script>
const v=document.querySelector('video');v.addEventListener('playing',()=>{const q=v.getVideoPlaybackQuality(),start=performance.now();setTimeout(()=>{const r=v.getVideoPlaybackQuality();document.querySelector('#result').textContent=JSON.stringify({seconds:(performance.now()-start)/1000,frames:r.totalVideoFrames-q.totalVideoFrames,dropped:r.droppedVideoFrames-q.droppedVideoFrames},null,2)},8200)},{once:true});
</script></html>
