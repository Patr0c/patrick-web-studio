name: Generate project preview posters
on:
  push:
    branches:
      - perf/animation-loading-20261022
    paths:
      - .github/workflows/generate-project-posters.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-posters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Capture an actual frame from each screen recording
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          mkdir -p previews
          src='Patrick _ Digital Rework · Archivo_files'
          for name in hrservice villa wagner; do
            test -s "$src/${name}_Iu_u.mp4"
            ffmpeg -hide_banner -loglevel error -nostdin -y -ss 0.1 \
              -i "$src/${name}_Iu_u.mp4" \
              -frames:v 1 -vf 'scale=720:-2' -q:v 4 "previews/${name}.jpg"
            test -s "previews/${name}.jpg"
          done
      - name: Commit lightweight posters to this development branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/hrservice.jpg previews/villa.jpg previews/wagner.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Add screen-recording stills for instant project previews [skip ci]'
            git push origin HEAD:perf/animation-loading-20261022
          fi
